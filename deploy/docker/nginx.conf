server {
    listen 9898;
    listen [::]:9898;
    server_name _;
    server_tokens off;
    client_max_body_size 51m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'" always;

    root /usr/share/nginx/html;
    index index.html;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Test-data uploads validate/extract ZIPs and fsync each file; a large
        # archive can legitimately exceed 30s. Keep aligned with the frontend
        # upload timeout (180s).
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?|ttf)$ {
        expires 7d;
        try_files $uri =404;
    }
}
